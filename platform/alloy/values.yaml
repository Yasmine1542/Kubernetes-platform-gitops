alloy:
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "__host__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "flow-collector"
          target_label  = "job"
          replacement   = "calico-flows"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets               = local.file_match.pod_logs.targets
        forward_to            = [loki.process.parse_cri.receiver]
        legacy_positions_file = "/var/lib/alloy/positions/positions.yaml"
        tail_from_end         = true
      }

      loki.process "parse_cri" {
        stage.cri {}

        stage.label_keep {
          values = ["namespace", "pod", "container", "node", "job", "stream", "service_name"]
        }

        forward_to = [loki.write.loki_gateway.receiver]
      }

      loki.write "loki_gateway" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      prometheus.exporter.unix "node" {
      }

      prometheus.scrape "node" {
        targets    = prometheus.exporter.unix.node.targets
        forward_to = [prometheus.remote_write.prometheus.receiver]
        job_name   = "integrations/unix"

        scrape_interval = "15s"
      }

      prometheus.remote_write "prometheus" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }
  mounts:
    varlog: true
controller:
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  type: daemonset
  volumeMounts:
    extra:
    - mountPath: /var/lib/alloy/positions
      name: alloy-positions
  volumes:
    extra:
    - hostPath:
        path: /var/lib/alloy/positions
        type: DirectoryOrCreate
      name: alloy-positions
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
