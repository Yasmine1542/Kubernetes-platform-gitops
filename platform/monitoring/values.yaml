alertmanager:
  alertmanagerSpec:
    priorityClassName: platform-monitoring
    # Mounts secret/aiops-webhook-token (key: token) at
    # /etc/alertmanager/secrets/aiops-webhook-token/token so the aiops receiver
    # can bearer-auth without the token living in Git. Create it once:
    #   kubectl -n monitoring create secret generic aiops-webhook-token \
    #     --from-literal=token=<same value as netguard-secrets AIOPS_WEBHOOK_TOKEN>
    secrets:
      - aiops-webhook-token
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 512Mi
          storageClassName: longhorn
  config:
    inhibit_rules:
    - equal:
      - instance
      source_matchers:
      - severity = critical
      - alertname = NodeHighMemory
      target_matchers:
      - severity = warning
    - equal:
      - job
      - namespace
      source_matchers:
      - severity = critical
      target_matchers:
      - severity = warning
    receivers:
    - name: null-receiver
    - name: webhook-critical
      webhook_configs:
      - send_resolved: true
        url: http://alertmanager-webhook.monitoring.svc.cluster.local/critical
    - name: webhook-warning
      webhook_configs:
      - send_resolved: true
        url: http://alertmanager-webhook.monitoring.svc.cluster.local/warning
    # Triggers an AIOps diagnosis run in the netguard namespace. send_resolved is
    # off so a recovery does not kick off a (costly) LLM pipeline; bearer token is
    # read from the mounted secret file (see alertmanagerSpec.secrets above).
    - name: aiops-webhook
      webhook_configs:
      - send_resolved: false
        url: http://aiops-engine.netguard.svc.cluster.local:8000/api/aiops/webhook
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/aiops-webhook-token/token
    route:
      group_by:
      - alertname
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: null-receiver
      repeat_interval: 12h
      routes:
      # Curated failure modes → AIOps diagnosis. continue:true so the alert ALSO
      # falls through to the severity routes below (debug sink). Matching by
      # alertname (not severity) gives precise control over what spends an LLM run.
      - continue: true
        receiver: aiops-webhook
        group_wait: 30s
        repeat_interval: 1h
        matchers:
        - alertname =~ "KubePodCrashLooping|KubePodNotReady|KubeContainerWaiting|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|KubeNodeNotReady|KubePersistentVolumeErrors|KubePersistentVolumeFillingUp|TargetDown|PodEvicted"
      - continue: false
        group_wait: 10s
        matchers:
        - severity = critical
        receiver: webhook-critical
        repeat_interval: 1h
      - continue: false
        group_wait: 2m
        matchers:
        - severity = warning
        receiver: webhook-warning
        repeat_interval: 4h
      - continue: false
        matchers:
        - severity = info
        receiver: null-receiver
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    enabled: true
    hosts:
    - alertmanager.cluster.lan
    ingressClassName: nginx
    pathType: Prefix
    paths:
    - /
    tls:
    - hosts:
      - alertmanager.cluster.lan
      secretName: alertmanager-tls
grafana:
  priorityClassName: platform-monitoring
  deploymentStrategy:
    type: Recreate
  additionalDataSources:
  - access: proxy
    isDefault: false
    name: Loki
    type: loki
    uid: loki
    url: http://loki-gateway.monitoring.svc.cluster.local
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  image:
    tag: "12.0.2"
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    enabled: true
    hosts:
    - grafana.cluster.lan
    ingressClassName: nginx
    path: /
    pathType: Prefix
    tls:
    - hosts:
      - grafana.cluster.lan
      secretName: grafana-tls
  initChownData:
    enabled: false
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: longhorn
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: true
  endpoints:
  - 192.168.50.10
  service:
    enabled: true
    port: 2381
    targetPort: 2381
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  livenessProbe:
    failureThreshold: 10
  readinessProbe:
    failureThreshold: 10
nodeExporter:
  enabled: false
prometheus:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: cluster-ca
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    enabled: true
    hosts:
    - prometheus.cluster.lan
    ingressClassName: nginx
    pathType: Prefix
    paths:
    - /
    tls:
    - hosts:
      - prometheus.cluster.lan
      secretName: prometheus-tls
  prometheusSpec:
    priorityClassName: platform-monitoring
    enableRemoteWriteReceiver: true
    retention: 5d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi
          storageClassName: longhorn
# Custom alert for pod eviction (no built-in alertname covers it). Routed to the
# aiops-webhook via the alertname matcher above. Other failure modes
# (CrashLooping, NotReady, PVC errors, TargetDown) come from the built-in
# kube-prometheus-stack rules.
additionalPrometheusRulesMap:
  netguard-failure-modes:
    groups:
      - name: netguard.failuremodes
        rules:
          - alert: PodEvicted
            expr: kube_pod_status_reason{reason="Evicted"} > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} was evicted"
              description: "{{ $labels.pod }} has reason=Evicted (node resource pressure)."
