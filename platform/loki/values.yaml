backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  enabled: true
  replicas: 1
  priorityClassName: platform-monitoring
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h
  schemaConfig:
    configs:
    - from: "2024-01-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  priorityClassName: platform-monitoring
  persistence:
    enabled: true
    size: 3Gi
    storageClass: longhorn
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
write:
  replicas: 0
