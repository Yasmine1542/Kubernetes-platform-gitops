apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-frontend-config
  namespace: sample-app
data:
  frontend.py: |
    #!/usr/bin/env python3
    """
    Frontend server — serves the task manager HTML and proxies /api/* to the API.
    Uses only Python stdlib so no pip install needed.
    """
    import http.server
    import urllib.request
    import urllib.error
    import os

    API_URL = "http://sample-app-api.sample-app.svc.cluster.local:8000"
    HTML_FILE = "/app/index.html"

    class FrontendHandler(http.server.BaseHTTPRequestHandler):

        def log_message(self, fmt, *args):
            print(f"{self.address_string()} {fmt % args}", flush=True)

        def _proxy(self, method, data=None):
            headers = {}
            ct = self.headers.get('Content-Type')
            if ct:
                headers['Content-Type'] = ct
            try:
                req = urllib.request.Request(
                    f"{API_URL}{self.path}",
                    data=data,
                    headers=headers,
                    method=method,
                )
                with urllib.request.urlopen(req, timeout=5) as r:
                    body = r.read()
                    self.send_response(r.status)
                    self.send_header('Content-Type', r.headers.get('Content-Type', 'application/json'))
                    self.send_header('Content-Length', str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
            except urllib.error.HTTPError as e:
                body = e.read()
                self.send_response(e.code)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except Exception as e:
                body = str(e).encode()
                self.send_response(502)
                self.send_header('Content-Type', 'text/plain')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        def do_GET(self):
            if self.path in ('/', '/index.html'):
                with open(HTML_FILE, 'rb') as f:
                    body = f.read()
                self.send_response(200)
                self.send_header('Content-Type', 'text/html; charset=utf-8')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path.startswith('/api/'):
                self._proxy('GET')
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            if self.path.startswith('/api/'):
                length = int(self.headers.get('Content-Length', 0))
                data = self.rfile.read(length) if length else b''
                self._proxy('POST', data=data)
            else:
                self.send_response(404)
                self.end_headers()

    server = http.server.HTTPServer(('0.0.0.0', 8080), FrontendHandler)
    print('Frontend listening on :8080', flush=True)
    server.serve_forever()
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Task Manager — K8s Demo</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; min-height: 100vh; padding: 32px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.6rem; color: #1a1a2e; margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 24px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat-value { font-size: 2rem; font-weight: 700; color: #0066cc; line-height: 1; }
        .stat-label { color: #888; font-size: 0.8rem; margin-top: 4px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
                overflow: hidden; margin-bottom: 16px; }
        .card-header { padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #e9ecef;
                       font-weight: 600; font-size: 0.9rem; color: #333; }
        form { display: flex; gap: 8px; padding: 16px; }
        input[type=text] { flex: 1; padding: 8px 12px; border: 1px solid #ddd;
                           border-radius: 6px; font-size: 0.95rem; outline: none; }
        input[type=text]:focus { border-color: #0066cc; }
        button { padding: 8px 18px; background: #0066cc; color: #fff; border: none;
                 border-radius: 6px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
        button:hover { background: #0052a3; }
        .task-list { list-style: none; }
        .task-item { display: flex; justify-content: space-between; align-items: center;
                     padding: 11px 16px; border-bottom: 1px solid #f0f0f0; }
        .task-item:last-child { border-bottom: none; }
        .task-title { color: #333; font-size: 0.95rem; }
        .task-time { color: #aaa; font-size: 0.78rem; }
        .empty { padding: 24px; text-align: center; color: #aaa; font-size: 0.9rem; }
        .status-bar { font-size: 0.78rem; color: #999; padding: 8px 16px; border-top: 1px solid #f0f0f0; }
        .pipeline { background: #e8f4fd; border-left: 3px solid #0066cc;
                    padding: 10px 14px; border-radius: 4px; font-size: 0.82rem;
                    color: #444; margin-bottom: 16px; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Kubernetes 3-Tier Demo — frontend (Python) → api (Python/FastAPI) → postgres</p>

        <div class="pipeline" id="pipeline-info">Connecting to API...</div>

        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="task-count">—</div>
            <div class="stat-label">Tasks in DB</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="poll-count">0</div>
            <div class="stat-label">API polls (session)</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="error-count">0</div>
            <div class="stat-label">Errors</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Add Task</div>
          <form id="task-form">
            <input type="text" id="task-input" placeholder="Task title..." required>
            <button type="submit">Add</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header">Tasks</div>
          <ul class="task-list" id="task-list"><li class="empty">Loading...</li></ul>
          <div class="status-bar" id="status">—</div>
        </div>
      </div>

      <script>
        let polls = 0, errors = 0;

        async function loadTasks() {
          try {
            const [tasksRes, healthRes] = await Promise.all([
              fetch('/api/tasks'), fetch('/api/health')
            ]);
            const tasks = await tasksRes.json();
            const health = await healthRes.json();
            polls++;
            document.getElementById('task-count').textContent = tasks.length;
            document.getElementById('poll-count').textContent = polls;
            document.getElementById('pipeline-info').textContent =
              'Request path: browser → frontend (Python :8080) → api (Python :8000) → PostgreSQL (:5432) | API time: ' + health.time;
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.length === 0
              ? '<li class="empty">No tasks yet — add one above</li>'
              : tasks.map(t =>
                  '<li class="task-item"><span class="task-title">' + t.title +
                  '</span><span class="task-time">' + t.created_at + '</span></li>'
                ).join('');
            document.getElementById('status').textContent =
              'Last refreshed: ' + new Date().toLocaleTimeString() + ' · auto-refresh every 5s';
          } catch (e) {
            errors++;
            document.getElementById('error-count').textContent = errors;
            document.getElementById('status').textContent = 'Error: ' + e.message;
          }
        }

        document.getElementById('task-form').onsubmit = async (e) => {
          e.preventDefault();
          const title = document.getElementById('task-input').value.trim();
          if (!title) return;
          try {
            await fetch('/api/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title })
            });
            document.getElementById('task-input').value = '';
            loadTasks();
          } catch (e) { errors++; document.getElementById('error-count').textContent = errors; }
        };

        loadTasks();
        setInterval(loadTasks, 5000);
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-frontend
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app-frontend
    spec:
      containers:
        - name: frontend
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - python3
            - /app/frontend.py
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app
      volumes:
        - name: config
          configMap:
            name: sample-app-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-frontend
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app-frontend
spec:
  selector:
    app.kubernetes.io/name: sample-app-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app-frontend
  namespace: sample-app
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: app.cluster.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - app.cluster.lan
      secretName: sample-app-tls
