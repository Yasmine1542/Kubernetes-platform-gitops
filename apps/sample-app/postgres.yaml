apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sample-app-postgres-pvc
  namespace: sample-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-postgres
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app-postgres
    spec:
      securityContext:
        fsGroup: 26
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: sample-app-postgres-secret
                  key: db
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: sample-app-postgres-secret
                  key: user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-app-postgres-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - taskuser
                - -d
                - taskdb
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sample-app-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-postgres
  namespace: sample-app
  labels:
    app.kubernetes.io/name: sample-app-postgres
spec:
  selector:
    app.kubernetes.io/name: sample-app-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
